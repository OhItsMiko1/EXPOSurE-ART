name: CI

on:
  push:
  pull_request:

jobs:
  html-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate HTML
        run: npm run validate:html

      - name: Check links
        run: npm run check:links
