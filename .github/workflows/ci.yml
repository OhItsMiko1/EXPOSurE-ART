name: CI

on:
  push:
    branches: [main, replit-import]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Pre-existing type errors (~30, unrelated to this workflow) mean `tsc`
      # isn't clean yet. Keep it visible in CI output without blocking merges
      # until that debt is paid down separately.
      - run: npm run check
        continue-on-error: true
